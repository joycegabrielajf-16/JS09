
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura While</title>
</head>
<body>

    <h1>Estrutura de Repetição While</h1>

    <script>

        let contador = 1;

        while (contador <= 5) {
            document.write("<p>Contagem: " + contador + "</p>");

            contador++;
        }
    </script>

</body>
</html>
