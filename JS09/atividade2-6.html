
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura For</title>
</head>
<body>

    <h1>Estrutura de Repetição For</h1>

    <script>

        for (let contador = 1; contador <= 5; contador++) {
            document.write("<p>Contagem: " + contador + "</p>");
        }
    </script>

</body>
</html>
